kind: APIKey
metadata:
  name: skylink-key-acme-travel
  namespace: skylink-demo
  labels:
    app.kubernetes.io/part-of: skylink-demo
    skylink.example.com/gateway: public
spec:
  apiProductRef:
    name: skylink-flight-search
  planTier: Enterprise
