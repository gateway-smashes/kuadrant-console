apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flight-search-route
  namespace: skylink-demo
  labels:
    app.kubernetes.io/part-of: skylink-demo
    skylink.example.com/api: flight-search
spec:
  parentRefs:
    - name: skylink-public-gateway
      namespace: skylink-demo
  hostnames:
    - flights.skylink.example.com
  rules:
    - matches:
        - method: GET
          path:
            type: PathPrefix
            value: /flights
      backendRefs:
        - name: flight-search-svc
          port: 8080
          weight: 1
    - matches:
        - method: GET
          path:
            type: PathPrefix
            value: /schedules
      backendRefs:
        - name: flight-search-svc
          port: 8080
          weight: 1
---
